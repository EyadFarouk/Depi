<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <title>CRUD</title>
    <style>
        input{
            border-radius: 12px;
        }
    </style>
</head>
<body class="bg-black">
    <!-- <div class="d-flex">

    </div> -->
    <div class="container text-center">
        <p class="text-white fs-1 fw-bold">CRUD operations</p>
        <p class="text-white fs-1 fw-bold" id="time"></p>
        <div class="row gy-4">
            <div>
                <input type="text" class="col-12 ps-3" placeholder="Name" id="name">
            </div>

            <div class="col-12 col-md-2">
                <input type="text" class="w-100 ps-3" placeholder="Price" id="price">
            </div>
            <div class="col-12 col-md-2">
                <input type="text" class="w-100 ps-3" placeholder="Taxes" id="tax">
            </div>
            <div class="col-12 col-md-2">
                <input type="text" class="w-100 ps-3" placeholder="ads" id="ads">
            </div>
            <div class="col-12 col-md-2 order-1">
                <input type="text" class="w-100 ps-3" placeholder="Discount" id="discount">
            </div>
            <div class="col-12 col-md-4 order-last order-md-2">
                <button class="w-100 rounded-4">Total | 0</button>
            </div>
            
            <div class="col me-3 order-md-3">
                <input type="text" class="w-100 ps-3" placeholder="Count" id="count">
            </div>
            <div class="col order-md-4">
                <input type="text" class="w-100 ps-3" placeholder="Category" id="category">
            </div>
        </div>
    </div>
    <div class="container">
        <table class="table table-dark table-striped">
            <thead>
                <tr>
                <th scope="col">#</th>
                <th scope="col">Name</th>
                <th scope="col">Price</th>
                <th scope="col">Taxes</th>
                <th scope="col">Total</th>
                <th scope="col">Category</th>
                <th scope="col">Data added</th>
                <th scope="col">Data updated</th>
                <th scope="col">Update</th>
                <th scope="col">Delete</th>
                </tr>
            </thead>
            <tbody>

            </tbody>
        </table>
    </div>
    <script src="script.js"></script>
</body>
</html>
